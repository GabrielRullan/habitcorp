<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <!-- Background pastel rounded square -->
  <rect width="64" height="64" rx="16" fill="#FEF9C3" stroke="#FDE047" stroke-width="1.5"/>
  
  <!-- Banana Body -->
  <path d="M 46 16 C 42 14, 38 16, 34 20 C 25 29, 16 39, 16 48 C 16 52, 19 54, 23 52 C 33 47, 44 38, 47 28 C 49 23, 49 18, 46 16 Z" 
        fill="url(#bananaGrad)" stroke="#CA8A04" stroke-width="2" stroke-linejoin="round"/>
  

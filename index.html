<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/goblin-logo.png" />
    <title>HabitCorp — The Boring Cousin of Habitica</title>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('habitcorp_theme') || 'system';
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (theme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#fbf9f4] dark:bg-stone-950 text-stone-900 dark:text-stone-100 antialiased selection:bg-emerald-100 selection:text-emerald-950 dark:selection:bg-emerald-900 dark:selection:text-emerald-100 transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
